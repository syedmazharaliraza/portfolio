const hoverSheet=document.head.appendChild(document.createElement('style')).sheet;
const hoverCls=new Map();
function hoverClass(css){
  let cls=hoverCls.get(css);
  if(!cls){
    cls='hv'+hoverCls.size;
    const decl=css.split(';').map(d=>d.trim()).filter(Boolean).map(d=>d+' !important').join(';');
    hoverSheet.insertRule('.'+cls+':hover{'+decl+'}',hoverSheet.cssRules.length);
    hoverCls.set(css,cls);
  }
  return cls;
}
const styleCache=new Map();
function parseStyle(s){
  let o=styleCache.get(s);
  if(o)return o;
  o={};
  for(const d of s.split(';')){
    const i=d.indexOf(':'); if(i<0)continue;
    const k=d.slice(0,i).trim(); if(!k)continue;
    o[k.startsWith('--')?k:k.replace(/-([a-z])/g,(_,c)=>c.toUpperCase())]=d.slice(i+1).trim();
  }
  if(styleCache.size<2000)styleCache.set(s,o);
  return o;
}
function h(type,props,...children){
  if(props){
    props=Object.assign({},props);
    if(typeof props.style==='string')props.style=parseStyle(props.style);
    if(props['style-hover']){props.className=(props.className?props.className+' ':'')+hoverClass(props['style-hover']);delete props['style-hover'];}

}

  state={short:typeof window!=='undefined'&&window.innerHeight<800,ph:0,sel:'intro',playing:false,hint:true,mobile:typeof window!=='undefined'&&window.innerWidth<BP,wide:typeof window!=='undefined'&&window.innerWidth>=WIDE};

  componentDidMount(){
    this.onResize=()=>{const mobile=window.innerWidth<BP,wide=window.innerWidth>=WIDE,short=window.innerHeight<800;if(mobile!==this.state.mobile||wide!==this.state.wide||short!==this.state.short)this.setState({mobile,wide,short});};

      const tg=e.target; if(tg&&tg!==document.body&&tg.tagName!=='HTML')return;
      if(e.code==='Space'){e.preventDefault();this.togglePlay();}
      else if(e.key==='ArrowRight'){this.step(1);}else if(e.key==='ArrowLeft'){this.step(-1);}
    };
    window.addEventListener('resize',this.onResize);
    window.addEventListener('keydown',this.onKeyDown);
    const s=new URLSearchParams(location.search).get('select');
    if(s&&(clip(s)||PAGES.includes(s)||s==='infisical'))this.select(s);

    if(this.state.ph!==ps.ph){

      if(sc&&inn&&sc.scrollWidth>sc.clientWidth+2){
        const x=inn.offsetLeft+this.state.ph/TOTAL*inn.offsetWidth, w=sc.clientWidth;

  primaryAt(m){const e=EXP.find(c=>under(c,m));if(e)return e.id;return under(ORBIT,m)?'orbit':under(INFI,m)?'infisical':'gap';}
  isUnder(id,m){const c=clip(id);return !!c&&under(c,m);}
  setPh(next,mode,prev){
    next=clamp(next,0,TOTAL); const m=Math.min(next,TOTAL-0.001);
    let sel=this.state.sel;
    if(mode==='play'){
      const crossed=ORDER.filter(c=>c.s>prev&&c.s<=m);
      if(crossed.length)sel=crossed[crossed.length-1].id;
      else if(!this.isUnder(sel,m))sel=this.primaryAt(m);
    } else if(!this.isUnder(sel,m)) sel=this.primaryAt(m);
    this.setState({ph:next,sel});
  }
  pause(){if(this.state.playing){cancelAnimationFrame(this.raf);this.setState({playing:false});}}
  togglePlay(){
    if(this.state.playing){this.pause();return;}
    let start=this.state.ph, prev=start;
    if(start>=TOTAL-0.05||!clip(this.state.sel)){start=0;}
    if(start===0)prev=start-0.001;
    this.setState({playing:true,hint:false,ph:start});
    let last=performance.now(); const durMs=(this.props.playSeconds||20)*1000;
    const tick=(t)=>{
      const dt=Math.min(64,t-last); last=t;
      const next=this.state.ph+dt/durMs*TOTAL;
      this.setPh(next,'play',prev); prev=Math.min(next,TOTAL-0.001);
      if(next>=TOTAL){this.setState({playing:false});return;}
      this.raf=requestAnimationFrame(tick);
    };
    this.raf=requestAnimationFrame(tick);
  }
  select(id){
    this.pause();
    const c=clip(id), st={sel:id,hint:false};
    if(c)st.ph=c.s;
    if(id==='intro')st.ph=0;
    if(CASES[id])st.ph=clip('wg-l4').s;

  step(dir){
    const {sel,ph}=this.state;
    let i=ORDER.findIndex(c=>c.id===sel);

    else if(i<0){i=dir>0?ORDER.filter(c=>c.s<=ph).length-1:ORDER.filter(c=>c.s<ph).length;}
    const j=i+dir;
    if(j<0){this.select('intro');return;}
    if(j<ORDER.length)this.select(ORDER[j].id);
  }
  xToM(x){const r=this.innerRef.current.getBoundingClientRect();return (x-r.left)/r.width*TOTAL;}

    ${mobile?null:html`<a href="https://github.com/syedmazharaliraza" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;height:34px;padding:0 13px;border:1px solid #2e3035;border-radius:999px;text-decoration:none;font-size:13px" style-hover="border-color:#4a4d54;background:#1d1f23">GitHub ↗</a>`}
    ${mobile?null:html`<a href="mailto:mazharali.raza11@gmail.com" style="display:inline-flex;align-items:center;height:34px;padding:0 13px;border:1px solid #2e3035;border-radius:999px;text-decoration:none;font-size:13px" style-hover="border-color:#4a4d54;background:#1d1f23">Email</a>`}
    <a href=${RESUME} target="_blank" rel="noopener" style="display:inline-flex;align-items:center;height:34px;padding:0 14px;border-radius:999px;background:${ACCENT};color:#1a0c09;text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap" style-hover="background:oklch(0.78 0.16 30);color:#1a0c09">Resume ↗</a>
  </div>
</header>
${wide?null:nav}

<main ref=${this.stageRef} style="min-height:0;overflow-y:auto;overflow-x:hidden;container-type:inline-size;scrollbar-width:thin;scrollbar-color:#33363b transparent">
  <div key=${sel} style="max-width:1180px;margin:0 auto;padding:clamp(18px,3cqi,36px) clamp(16px,4cqi,48px) clamp(24px,4cqi,48px);animation:mediaIn 0.35s cubic-bezier(.3,.7,.2,1) both">
    ${this.renderStage()}
  </div>
</main>

<section aria-label="Career timeline" style="min-width:0;background:#121316;border-top:1px solid #222428;display:flex;flex-direction:column">
  <div style="flex:none;display:flex;align-items:center;gap:8px;min-height:50px;padding:6px 12px;flex-wrap:wrap">
    <button onClick=${()=>this.togglePlay()} aria-label=${playing?'Pause the tour':'Play the career tour'} style="display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 15px 0 13px;background:${ACCENT};border:0;border-radius:999px;color:#1a0c09;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap" style-hover="background:oklch(0.78 0.16 30)"><span style="font-size:10px;width:10px;text-align:center">${playing?'❚❚':'▶'}</span>${playText}</button>
    <button onClick=${()=>this.step(-1)} aria-label="Previous" title="Previous (←)" style="height:34px;width:34px;background:#1a1b1f;border:1px solid #2e3035;border-radius:999px;color:#ecebe8;font-size:15px;cursor:pointer" style-hover="background:#24262a">‹</button>
    <button onClick=${()=>this.step(1)} aria-label="Next" title="Next (→)" style="height:34px;width:34px;background:#1a1b1f;border:1px solid #2e3035;border-radius:999px;color:#ecebe8;font-size:15px;cursor:pointer" style-hover="background:#24262a">›</button>
    <span style="${MONO};font-size:14px;font-weight:500;color:oklch(0.82 0.12 30);padding:0 4px;min-width:8ch;white-space:nowrap">${phLabel}</span>
    <span style="flex:1"></span>
    ${mobile?null:html`<span style="font-size:12.5px;color:${hint?'oklch(0.85 0.08 30)':'#85878e'};white-space:nowrap">${hint?'Each bar is a role. Click one to open it, or press Play.':'Longer bar = longer time in the role'}</span>`}
  </div>
  <div style="display:flex;min-width:0">
    ${mobile?null:html`
      <div style="flex:none;width:112px;display:flex;flex-direction:column">
        <div style="height:24px"></div>
        <div style="height:${expH};padding:0 10px 0 16px;display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:#c9cacd"><span style="width:7px;height:7px;border-radius:50%;background:oklch(0.66 0.11 250)"></span>Experience</div>
        <div style="height:${projH};padding:0 10px 0 16px;display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:#c9cacd"><span style="width:7px;height:7px;border-radius:50%;background:oklch(0.66 0.11 160)"></span>Projects</div>
      </div>`}
    <div ref=${this.scrollRef} style="flex:1;min-width:0;overflow-x:${mobile?'auto':'hidden'};overflow-y:hidden;scrollbar-width:none">
      <div style="padding:0 ${mobile?'12px':'16px'} 8px ${mobile?'12px':'4px'};width:max-content;min-width:100%">
        <div ref=${this.innerRef} onPointerDown=${onDown} onPointerMove=${onMove} onPointerUp=${onUp} onClick=${onTrackClick} style="position:relative;width:${mobile?(TOTAL*MPX)+'px':'100%'};user-select:none;touch-action:${mobile?'pan-x':'none'}">
          <div style="position:relative;height:24px">
            ${ticks.map((t,i)=>html`<div key=${i} style="position:absolute;bottom:0;left:${t.left};width:1px;height:${t.h};background:${t.c}"></div>`)}
            ${yearLabels.map(y=>html`<div key=${y.label} style="position:absolute;top:4px;left:${y.left};transform:${y.tf};${MONO};font-size:10.5px;color:#7d8088;white-space:nowrap;padding:0 4px">${y.label}</div>`)}
          </div>
          <div style="position:relative;height:${expH}">
            ${EXP.map(view).map(c=>html`
              <div key=${c.id} data-clip=${c.id} title=${c.title} style="position:absolute;top:5px;bottom:5px;left:${c.left};width:${c.width};background:${c.bg};box-shadow:${c.ring};border-radius:8px;padding:5px 8px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:1px">
                <span style="font-size:12.5px;line-height:1.25;font-weight:600;color:${c.ink};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.short}</span>
                <span style="font-size:11px;line-height:1.25;color:${c.ink2};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.sub}</span>
              </div>`)}
          </div>
          <div style="position:relative;height:${projH}">
            ${[INFI,ORBIT].map(view).map(c=>html`
              <div key=${c.id} data-clip=${c.id} title=${c.title} style="position:absolute;top:4px;bottom:4px;left:${c.left};width:${c.width};background:${c.bg};box-shadow:${c.ring};border-radius:8px;padding:0 8px;overflow:hidden;cursor:pointer;display:flex;align-items:center">
                <span style="font-size:12px;font-weight:600;color:${c.ink};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.short}</span>
              </div>`)}
          </div>
          <div style="position:absolute;top:0;bottom:0;left:${(ph/TOTAL*100)+'%'};width:0;pointer-events:none;z-index:3">
            <div style="position:absolute;top:0;bottom:0;left:-1px;width:2px;background:${ACCENT}"></div>
            <div data-handle="1" title="Drag to scrub through time" style="position:absolute;top:0;left:-13px;width:26px;height:22px;display:flex;justify-content:center;pointer-events:auto;cursor:ew-resize;touch-action:none">
              <span style="margin-top:3px;width:12px;height:13px;background:${ACCENT};border-radius:3px 3px 6px 6px;box-shadow:0 2px 8px rgba(0,0,0,0.5)"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
</div>`;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App,{playSeconds:45}));
})();
</script>
</body>
</html>
